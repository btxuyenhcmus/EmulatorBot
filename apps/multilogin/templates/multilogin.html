{% extends 'base.html'%}
{% block content %}
  <h2>Multi-Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
    <button class="btn btn-lg btn-primary" type="submit">Login</button>
  </form>
{% endblock %}
