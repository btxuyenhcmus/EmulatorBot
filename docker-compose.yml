services:
  postgres:
    container_name: autongon_db
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DBNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - postgresdb:/var/lib/postgresql/data
    networks:
      - db_network

  django:
    container_name: autongon_django
    restart: always
    image: autongon-django
    build: .
    ports:
      - 8080:8080
    volumes:
      - ./:/app
    networks:
      - db_network

volumes:
  postgresdb:


networks:
  db_network:
    driver: bridge
